name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install and copy web code into the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Build test APK (install this on your phone)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Build signed release bundle (upload this to Google Play)
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEY_B64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: upload
        working-directory: android
        run: |
          set -o pipefail
          export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          # Strip spaces/newlines that can sneak in when pasting the secret
          printf '%s' "$KEY_B64" | tr -d ' \r\n\t' | base64 -d > "$UPLOAD_KEYSTORE_PATH" \
            || { echo "::error::UPLOAD_KEYSTORE_BASE64 is not valid base64. Re-paste the full contents of keystore-base64.txt."; exit 1; }
          export UPLOAD_KEYSTORE_PASSWORD="$(printf '%s' "$UPLOAD_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          echo "Keystore size: $(wc -c < "$UPLOAD_KEYSTORE_PATH") bytes"
          if ! keytool -list -keystore "$UPLOAD_KEYSTORE_PATH" -storepass "$UPLOAD_KEYSTORE_PASSWORD" -alias upload > "$RUNNER_TEMP/keytool.txt" 2>&1; then
            echo "::error::Keystore check failed: $(tr '\n' ' ' < "$RUNNER_TEMP/keytool.txt" | cut -c1-300)"; exit 1
          fi
          if ! ./gradlew bundleRelease --no-daemon --stacktrace > "$RUNNER_TEMP/gradle.txt" 2>&1; then
            tail -60 "$RUNNER_TEMP/gradle.txt"
            echo "::error::Gradle failed: $(grep -A4 'What went wrong' "$RUNNER_TEMP/gradle.txt" | tr '\n' ' ' | cut -c1-600)"; exit 1
          fi
          ls -la app/build/outputs/bundle/release/

      - uses: actions/upload-artifact@v5
        with:
          name: test-apk-install-on-phone
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v5
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        with:
          name: release-aab-upload-to-google-play
          path: android/app/build/outputs/bundle/release/app-release.aab
